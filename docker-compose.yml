version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  backend:
    image: cloud-devops-backend:v1.0.0
    build: ./services/backend
    container_name: devops-backend
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    image: cloud-devops-frontend:v1.0.0
    build: ./services/frontend
    container_name: devops-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - app-network
