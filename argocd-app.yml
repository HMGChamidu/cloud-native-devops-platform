apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-native-devops-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HMGChamidu/cloud-native-devops-platform.git'
    targetRevision: HEAD
    path: terraform/environments/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: devops-platform-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
